name: Build & Auto Release Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PATH
        run: |
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build deploy jar
        run: ./gradlew deploy --no-daemon

      - name: List build outputs
        run: ls -la build/libs/

      - name: Upload built jar file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: build/libs/*.jar

      - name: Generate safe tag and release info
        id: release_info
        shell: bash
        run: |
          MESSAGE="$(jq -r '.head_commit.message // "Manual Build"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo 'Manual Build')"
          TITLE="$(printf "%s" "$MESSAGE" | head -n 1)"
          BODY="$(printf "%s" "$MESSAGE" | tail -n +2 | sed '/./,$!d')"

          SAFE_TAG="$(printf "%s" "$TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^[-.]*//;s/[-.]*$//')"

          if [ -z "$SAFE_TAG" ]; then
            SAFE_TAG="build"
          fi

          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          TAG_NAME="${SAFE_TAG}-${TIMESTAMP}"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          cat > release_body.md <<EOF
          $BODY
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: release_body.md
          files: build/libs/*.jar
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
