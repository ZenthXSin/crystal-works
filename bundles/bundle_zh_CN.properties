mod.crystal-works.name = 晶工
mod.crystal-works.description = 晶能科技模组 - 新增晶矿及其加工联动，炮塔/防御系统
item.crystal.name = 水晶
item.crystal.description = 高电荷容量的蓝色晶矿，硬度4，可被5级钻机采集。
item.crystal-alloy.name = 晶合金
item.crystal-alloy.description = 由水晶和铅精炼而成的导电合金，硬度1。
liquid.crystal-fluid.name = 晶流体
liquid.crystal-fluid.description = 蓝色冷却液体，中等热容量，适合中阶散热。
block.crystal-drill.name = 水晶钻机
block.crystal-drill.description = 5级钻机，配备硬度倍增器和液体增压功能。
block.crystal-smelter.name = 晶熔炉
block.crystal-smelter.description = 将水晶和铅熔炼为晶合金，高温作业。
block.crystal-fluid-mixer.name = 晶混合器
block.crystal-fluid-mixer.description = 将水晶与水混合生成晶流体。
block.crystal-borer.name = 水晶冲击钻机
