block.crystal-turret.name = 晶炮塔
block.crystal-turret.description = 发射水晶弹头，附带麻痹效果。使用水晶弹药。
block.crystal-wall.name = 晶墙
block.crystal-wall.description = 导电防护墙，被攻击时偶尔触发闪电反击。
block.crystal-wall-large.name = 大型晶墙
block.crystal-wall-large.description = 大型导电防护墙，被攻击时触发闪电反击。
block.crystal-ore.name = 晶矿石
block.crystal-ore.description = 含水晶的岩石，可用钻机开采。可铺设在地面上。
block.crystal-conduit.name = 水晶导管
block.crystal-conduit.description = 由晶合金制成的高效流体管道，传输液体摩擦更小。
status.crystal-shock.name = 晶麻痹
status.crystal-shock.description = 移动和防御降低，持续数秒。
techtree.crystal-works = 晶工
block.crystal-battery.name = 水晶储能器
block.crystal-battery.description = 储存晶能电力，供过于求时充电，供不应求时放电。
block.crystal-fluid-turret.name = 晶流体炮塔
block.crystal-fluid-turret.description = 发射过热的晶流体攻击敌人，融化护甲。
block.crystal-generator.name = 水晶发电机
block.crystal-generator.description = 消耗晶合金发电，运行时有电光特效。
block.crystal-bridge-conduit.name = 水晶导管桥
