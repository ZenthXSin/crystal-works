block.crystal-liquid-junction.name = 水晶液体节点
block.crystal-liquid-junction.description = 用于分流液体流动的水晶节点。
block.crystal-power-node.name = 水晶电力节点
block.crystal-power-node.description = 紧凑型水晶电力节点，用于扩展局部电网连接。
block.crystal-beam-tower.name = 水晶束能塔
block.crystal-beam-tower.description = 带缓冲的束能塔，可沿直线连接水晶电网。
